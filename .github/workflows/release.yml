name: Release
run-name: "Release ${{ github.ref_name }}"

# Everything this release does lives in cameraunlock-core's release-mod.yml.
# Only the values below are this mod's. Pinned to a commit SHA, never a branch:
# that workflow runs with contents:write, the Discord webhook and the Lopari PAT.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-mod.yml@435915a8a3d8e1b799cc169b74f1fcf72b9534e7
    with:
      project-name: 'Head Tracking for Superliminal'
      version-source: csproj
      version-path: 'src/SuperliminalHeadTracking/SuperliminalHeadTracking.csproj'
      # Must match the -ArtifactPaths in scripts/release.ps1 exactly. Both feed a
      # `git log -- <pathspec>`, so a wider list here puts build-tooling commits in
      # the published release notes that the CHANGELOG does not have, and weakens
      # the noise gate that is supposed to fail a tooling-only release.
      artifact-paths: 'src/SuperliminalHeadTracking/ cameraunlock-core scripts/install.cmd scripts/uninstall.cmd'
      dotnet-version: '8.0.x'
    permissions:
      contents: write
    secrets: inherit
