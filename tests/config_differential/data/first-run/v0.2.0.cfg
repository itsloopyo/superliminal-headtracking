## Settings file was created by plugin Superliminal Head Tracking v0.2.0
## Plugin GUID: com.cameraunlock.superliminal.headtracking

[Collision]

## Cut a lean back to whatever the level leaves room for, so the view never ends up inside a wall. No effect in rotation-only mode. The sweep uses the same physics mask ResizeScript uses once it is holding something, narrowed to the layers Unity's collision matrix says the player capsule collides with, so neither the object in your hands nor a portal plane is ever what stops the lean. Measured in game at this margin: in a test chamber corridor with the eye 0.46 m off a wall it cuts a 0.40 m lean to 0.29 m and holds the eye there however hard the head leans. In open rooms it does nothing, because the character capsule already keeps the eye about 0.83 m off anything you can walk into and a clamp needs roughly 0.5 m. So it is quiet in the large spaces and active in the tight ones, which is the right way round.
# Setting type: Boolean
# Default value: true
CollisionEnabled = true

## Distance in meters the eye is held off a surface. Raised at runtime if it does not clear the camera's near clip plane, since anything closer than that is culled and the player sees through the wall anyway.
# Setting type: Single
# Default value: 0.12
# Acceptable value range: From 0.02 to 0.6
CollisionMargin = 0.12

## Smoothing applied as the lean opens back up after an obstruction clears. 0.9 is a 200ms time constant. Tightening is never smoothed.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0 to 1
CollisionReleaseSmoothing = 0.9

[Diagnostics]

## Log one line per second carrying the applied pose, the tracked camera basis measured against the clean one, the lean, the aim distance and the crosshair offset together, so a direction fault can be settled by arithmetic rather than by playing.
# Setting type: Boolean
# Default value: false
LogAimGeometry = false

[General]

## Whether head tracking is enabled when the game starts
# Setting type: Boolean
# Default value: true
EnabledOnStartup = true

## Whether to show a notification when the plugin initializes
# Setting type: Boolean
# Default value: true
ShowStartupNotification = true

## Yaw mode: true = horizon-locked yaw (default), false = camera-local
# Setting type: Boolean
# Default value: true
WorldSpaceYaw = true

[Keybindings]

